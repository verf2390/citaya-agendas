name: Citaya AI Core

on:
  push:
    branches:
      - main
    paths:
      - "app/admin/asistente/**"
      - "app/api/admin/ai/**"
      - "components/admin/AdminNav.tsx"
      - "docs/ai/**"
      - "lib/ai/**"
      - "services/ai-gateway/**"
      - "migrations/*citaya_ai_core*"
      - "tests/ai-*.test.mjs"
      - "tests/security/citaya-ai-*.test.mjs"
      - ".github/workflows/citaya-ai-core.yml"
  pull_request:
    paths:
      - "app/admin/asistente/**"
      - "app/api/admin/ai/**"
      - "components/admin/AdminNav.tsx"
      - "docs/ai/**"
      - "lib/ai/**"
      - "services/ai-gateway/**"
      - "migrations/*citaya_ai_core*"
      - "tests/ai-*.test.mjs"
      - "tests/security/citaya-ai-*.test.mjs"
      - ".github/workflows/citaya-ai-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: AI Core tests
        run: node --test tests/ai-*.test.mjs tests/security/citaya-ai-*.test.mjs

      - name: AI Core lint
        run: >
          npx eslint
          app/admin/asistente/page.tsx
          app/api/admin/ai/assistant/route.ts
          components/admin/AdminNav.tsx
          "lib/ai/**/*.ts"
          "services/ai-gateway/**/*.mjs"
          tests/ai-*.test.mjs
          tests/security/citaya-ai-*.test.mjs

      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-anon-key
          SUPABASE_SERVICE_ROLE_KEY: synthetic-service-role-key-000000000000000000000000000000000000000000000000
          CITAYA_AI_ENABLED: "false"
        run: npm run build
