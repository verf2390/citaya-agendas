name: CITAYA Marketing Verification

on:
  pull_request:
    paths:
      - "app/(marketing)/**"
      - "app/servicios/**"
      - "app/empresa/**"
      - "app/planes/**"
      - "app/demos/**"
      - "app/servicios-demo/**"
      - "app/inmo-demo/**"
      - "app/tenants/[slug]/DemoQuoteCard.tsx"
      - "lib/commercial/**"
      - "tests/marketing-*.test.mjs"
      - "tests/demo-commercial-copy.test.mjs"
      - "components/admin/dte/ManualIssuanceForm.tsx"
      - "tests/customer-billing-flow.test.mjs"
      - ".github/workflows/citaya-marketing-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Commercial regression tests (required)
        run: node --test tests/marketing-*.test.mjs tests/demo-commercial-copy.test.mjs
      - name: Full regression suite (required)
        run: npm test
      - name: Offline DTE 33 purchase order and snapshot regression
        run: |
          DTE_TEST_FILE=dte-invoice-oc-reference.test.ts npm run dte:test
          DTE_TEST_FILE=dte-invoice-drafts.test.ts npm run dte:test
      - name: Install isolated XML schema and synthetic-signature validation tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-utils xmlsec1
      - name: Offline Factura 33 with OC 801 against DTE_v10 XSD
        run: DTE_TEST_FILE=dte-production-xsd-regression.test.ts npm run dte:test
      - name: Lint CIT-143 billing and DTE files
        run: npx eslint app/api/admin/invoice-drafts lib/dte/invoice-drafts.ts lib/dte/chile-issue-date.ts lib/dte/automation/worker.ts lib/dte/production/service.ts lib/dte/__tests__/dte-invoice-oc-reference.test.ts lib/dte/__tests__/dte-invoice-drafts.test.ts lib/dte/__tests__/dte-production-xsd-regression.test.ts
      - name: Lint affected marketing files
        run: |
          npx eslint "app/(marketing)/components/home" "app/tenants/[slug]/DemoQuoteCard.tsx" "app/servicios" "app/servicios-demo" "app/inmo-demo" "lib/commercial" "tests/marketing-*.test.mjs" "tests/demo-commercial-copy.test.mjs" "components/admin/dte/ManualIssuanceForm.tsx" "tests/customer-billing-flow.test.mjs"
      - name: Production build with synthetic test environment
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-anon-key
          SUPABASE_SERVICE_ROLE_KEY: synthetic-service-role-key-000000000000000000000000000000000000000000
          CITAYA_AI_ENABLED: "false"
        run: npm run build
