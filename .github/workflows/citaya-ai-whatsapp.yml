name: Citaya AI WhatsApp

on:
  pull_request:
    paths:
      - "app/api/webhooks/whatsapp/**"
      - "lib/whatsapp/**"
      - "migrations/*cit87_whatsapp*"
      - "docs/ai/WHATSAPP_AI.md"
      - "tests/whatsapp-*.test.mjs"
      - "tests/security/cit87-whatsapp-*.test.mjs"
      - "tests/security/fixtures/cit64-tenant-boundaries.mjs"
      - ".github/workflows/citaya-ai-whatsapp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: WhatsApp foundation tests
        run: >
          node --test
          tests/whatsapp-*.test.mjs
          tests/security/cit87-whatsapp-*.test.mjs

      - name: WhatsApp foundation lint
        run: >
          npx eslint
          app/api/webhooks/whatsapp/route.ts
          "lib/whatsapp/**/*.ts"
          tests/whatsapp-*.test.mjs
          tests/security/cit87-whatsapp-*.test.mjs

      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-anon-key
          SUPABASE_SERVICE_ROLE_KEY: synthetic-service-role-key-000000000000000000000000000000000000000000000000
          CITAYA_AI_ENABLED: "false"
        run: npm run build
